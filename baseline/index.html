<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>SLAM baseline</title>
  <style>
    :root {
      --text: #fff;
      --secondary-text: rgba(235, 235, 245, 0.7);
      --material: rgba(30, 30, 32, 0.78);
      --separator: rgba(84, 84, 88, 0.6);
      --accent: #0a84ff;
      --good: #30d158;
      --warning: #ffd60a;
      font: 17px/1.35 -apple-system, system-ui, sans-serif;
      color: var(--text);
    }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }

    #readout, #card {
      position: fixed;
      /* The engine moves the canvas to the end of the page, which would paint it over these. */
      z-index: 1;
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      background: var(--material);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border-radius: 16px;
    }
    #readout {
      top: max(12px, env(safe-area-inset-top));
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 8px 4px;
      text-align: center;
    }
    #readout[hidden] { display: none; }
    #readout dt { font-size: 11px; color: var(--secondary-text); }
    #readout dd { margin: 0; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
    #readout dd.good { color: var(--good); }
    #readout dd.warning { color: var(--warning); }

    #card {
      bottom: max(12px, env(safe-area-inset-bottom));
      padding: 16px;
      max-height: 72vh;
      overflow-y: auto;
    }
    #card .step { margin: 0 0 2px; font-size: 13px; color: var(--secondary-text); }
    #card h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
    #card p { margin: 0 0 14px; font-size: 15px; color: var(--secondary-text); }
    #card label { display: flex; gap: 10px; align-items: center; min-height: 44px; margin: 0 0 10px; font-size: 15px; }
    #card input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
    #card button {
      display: block;
      width: 100%;
      min-height: 50px;
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 600;
      color: var(--text);
      background: var(--accent);
    }
    #card button.secondary { background: rgba(120, 120, 128, 0.36); }
    #card button:disabled { opacity: 0.4; }

    #card table { width: 100%; margin: 0 0 12px; border-collapse: collapse; font-size: 15px; }
    #card th {
      padding: 14px 0 4px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: var(--secondary-text);
    }
    #card td { padding: 7px 0; border-top: 0.5px solid var(--separator); }
    #card td:first-child { color: var(--secondary-text); }
    #card td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    #card .licence { margin: 12px 0 0; font-size: 11px; }
    #card .licence a { color: inherit; }
  </style>
  <script src="capture-wasm-memory.js"></script>
  <script src="xr/xr.js" async data-preload-chunks="slam"></script>
  <script type="importmap">
    {"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js"}}
  </script>
  <script type="module" src="baseline.js"></script>
</head>
<body>
  <canvas id="camera"></canvas>
  <dl id="readout" hidden>
    <div><dt>Tracking</dt><dd id="readout-tracking">–</dd></div>
    <div><dt>Display fps</dt><dd id="readout-fps">–</dd></div>
    <div><dt>Tracker ms</dt><dd id="readout-tracker">–</dd></div>
    <div><dt>Points</dt><dd id="readout-points">–</dd></div>
    <div><dt>Wasm MB</dt><dd id="readout-memory">–</dd></div>
  </dl>
  <section id="card"></section>
</body>
</html>
